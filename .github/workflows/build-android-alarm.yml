name: Build Android Alarm APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-alarm/**"
      - ".github/workflows/build-android-alarm.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable Android alarm APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-alarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build app-debug.apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-B2B-Alarm-APK
          path: android-alarm/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
