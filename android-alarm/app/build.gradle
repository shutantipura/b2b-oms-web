plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lotusb2b.alarm'
    compileSdk 35

    defaultConfig {
        applicationId "com.lotusb2b.alarm"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
