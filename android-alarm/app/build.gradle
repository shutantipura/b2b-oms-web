plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lotusb2b.alarm'
    compileSdk 35

    defaultConfig {
        applicationId "com.lotusb2b.alarm"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "0.7.0"
    }

    // Stable release signing is opt-in via protected GitHub Actions secrets.
    // Never commit a keystore or its passwords into this repository.
    signingConfigs {
        release {
            def keyFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
