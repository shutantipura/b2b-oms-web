name: Build Android Alarm APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-alarm/**"
      - ".github/workflows/build-android-alarm.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable Android alarm APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-alarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build app-debug.apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build signed release APK (only after secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Release signing secrets are incomplete; the debug APK is still available."
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="${RUNNER_TEMP}/lotus-b2b-release.jks"
          trap 'rm -f "${ANDROID_KEYSTORE_FILE}"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_KEYSTORE_FILE}"
          chmod 600 "${ANDROID_KEYSTORE_FILE}"
          gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK when configured
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-B2B-Alarm-Release-Signed
          path: android-alarm/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-B2B-Alarm-APK
          path: android-alarm/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
